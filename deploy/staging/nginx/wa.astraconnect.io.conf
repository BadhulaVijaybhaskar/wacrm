# DRAFT nginx site file for staging: wa.astraconnect.io
#
# Install (as root, after certbot has issued certs):
#   sudo cp deploy/staging/nginx/wa.astraconnect.io.conf \
#     /etc/nginx/sites-available/wa.astraconnect.io
#   sudo ln -sf /etc/nginx/sites-available/wa.astraconnect.io \
#     /etc/nginx/sites-enabled/wa.astraconnect.io
#   # Ensure the Upgrade map exists once in http{} (see bottom of this file).
#   sudo mkdir -p /etc/nginx/htpasswd
#   sudo htpasswd -c /etc/nginx/htpasswd/wa.astraconnect.io staginguser
#   sudo nginx -t && sudo systemctl reload nginx
#
# Upstream is the staging compose app bound ONLY to 127.0.0.1:3101.
#
# IMPORTANT — Meta webhook bypass:
#   /api/whatsapp/webhook MUST have `auth_basic off`. Meta's Cloud API
#   cannot send HTTP Basic credentials. That path is still protected by
#   Meta's own HMAC (`x-hub-signature-256` verified with META_APP_SECRET).
#   Do not remove the auth_basic off exception.

upstream wacrm_staging_app {
    server 127.0.0.1:3101;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name wa.astraconnect.io;

    # ACME HTTP-01 (certbot renew)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wa.astraconnect.io;

    # Let's Encrypt paths (certbot certonly --nginx -d wa.astraconnect.io)
    ssl_certificate     /etc/letsencrypt/live/wa.astraconnect.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wa.astraconnect.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Site-wide basic auth (staging gate). Meta webhook excluded below.
    auth_basic           "wacrm staging";
    auth_basic_user_file /etc/nginx/htpasswd/wa.astraconnect.io;

    client_max_body_size 20m;

    # ---- Meta WhatsApp webhook: NO basic auth ----
    # Meta posts here with x-hub-signature-256 only. Basic auth would
    # break webhook delivery (401 from nginx before Next.js sees it).
    location = /api/whatsapp/webhook {
        auth_basic off;

        proxy_pass http://wacrm_staging_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://wacrm_staging_app;
        proxy_http_version 1.1;

        # WebSocket upgrade headers (requires map $http_upgrade
        # $connection_upgrade in http{} — see snippet below).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---------------------------------------------------------------------------
# Add this map ONCE inside the top-level http { } block (e.g.
# /etc/nginx/conf.d/connection_upgrade.conf) if it is not already present:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
# ---------------------------------------------------------------------------
