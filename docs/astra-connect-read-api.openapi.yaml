openapi: 3.0.3
info:
  title: Astra Connect read & handoff API
  version: "1.1.0"
  description: |
    Server-to-server endpoints for Astra Connect to read WhatsApp threads
    owned by Astra Chat and to take over / hand back AI.

    Auth headers on every call:
      - X-Astra-Timestamp
      - X-Astra-Signature (sha256=<hex>)
      - X-Astra-Tenant (must match tenant_id query/body)

    HMAC signed string (Connect console client Astraconnect 647b711;
    HMAC-SHA256 hex, 300s window):
      - GET/HEAD: `${ts}.${pathWithQuery}.${tenant}`
      - POST: `${ts}.${rawBody}.${tenant}`
    where `tenant` is the X-Astra-Tenant header value.
    (Inbound webhook adapter contract v2 remains `${ts}.${rawBody}`.)

    Reads: 600/min/tenant. Takeover/handback: 120/min/tenant.
    304 responses cost 0.25 of a read unit.
servers:
  - url: https://chat.example.com
security:
  - AstraHmac: []
  - AstraTenant: []
paths:
  /api/astra-connect/v1/conversations:
    get:
      operationId: listConversations
      summary: List conversations for a tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AstraTenantHeader"
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: employee_id
          in: query
          schema: { type: string }
        - name: phone_number_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [open, pending, closed] }
        - name: updated_since
          in: query
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Conversation page
          headers:
            ETag:
              schema: { type: string }
              description: max(updated_at) + count for the filtered set
          content:
            application/json:
              schema:
                type: object
                required: [conversations, next_cursor]
                properties:
                  conversations:
                    type: array
                    items: { $ref: "#/components/schemas/Conversation" }
                  next_cursor:
                    type: string
                    nullable: true
        "304":
          description: Not modified (If-None-Match matched)
          headers:
            ETag:
              schema: { type: string }
        "400": { description: Missing X-Astra-Tenant or tenant_id }
        "401": { description: Invalid or missing signature }
        "404": { description: Unknown tenant or tenant header mismatch }
        "429": { description: Rate limited (600/min reads) }
  /api/astra-connect/v1/conversations/{id}/messages:
    get:
      operationId: listMessages
      summary: List messages in a conversation (newest first)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AstraTenantHeader"
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: before
          in: query
          description: >
            Older-page cursor. Opaque keyset from next_cursor, or ISO-8601
            upper bound on created_at. Stable order is created_at,id descending.
          schema: { type: string }
        - name: cursor
          in: query
          description: Alias for an opaque keyset cursor
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: after
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Message page
          headers:
            ETag:
              schema: { type: string }
              description: max(created_at) + count
          content:
            application/json:
              schema:
                type: object
                required: [messages, next_cursor]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  next_cursor:
                    type: string
                    nullable: true
        "304":
          description: Not modified
          headers:
            ETag:
              schema: { type: string }
        "400": { description: Missing tenant header or invalid before cursor }
        "404": { description: Conversation not in this tenant }
        "429": { description: Rate limited }
  /api/astra-connect/v1/conversations/{id}/takeover:
    post:
      operationId: takeoverConversation
      summary: Hand thread to human (stop AI)
      parameters:
        - $ref: "#/components/parameters/AstraTenantHeader"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string }
                by: { type: string }
      responses:
        "200":
          description: Handoff state after takeover
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandoffResult" }
        "400": { description: Missing X-Astra-Tenant }
        "404": { description: Not found or tenant mismatch }
        "429": { description: Rate limited (120/min handoff) }
  /api/astra-connect/v1/conversations/{id}/handback:
    post:
      operationId: handbackConversation
      summary: Resume AI on a thread
      parameters:
        - $ref: "#/components/parameters/AstraTenantHeader"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string }
                by: { type: string }
      responses:
        "200":
          description: Handoff state after handback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandoffResult" }
        "400": { description: Missing X-Astra-Tenant }
        "404": { description: Not found or tenant mismatch }
        "429": { description: Rate limited (120/min handoff) }
components:
  securitySchemes:
    AstraHmac:
      type: apiKey
      in: header
      name: X-Astra-Signature
      description: |
        Pair with X-Astra-Timestamp and X-Astra-Tenant. Signature is
        sha256=<hex> (HMAC-SHA256, 300s window) over
        `${ts}.${pathWithQuery}.${tenant}` for GET and
        `${ts}.${rawBody}.${tenant}` for POST.
    AstraTenant:
      type: apiKey
      in: header
      name: X-Astra-Tenant
      description: Must match tenant_id in the query (GET) or JSON body (POST).
  parameters:
    TenantId:
      name: tenant_id
      in: query
      required: true
      schema: { type: string }
    AstraTenantHeader:
      name: X-Astra-Tenant
      in: header
      required: true
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }
      description: Return 304 when equal to the current collection ETag
  schemas:
    Conversation:
      type: object
      required:
        - id
        - tenant_id
        - astra_conversation_id
        - employee_id
        - status
        - handoff
        - unread_count
        - last_message_preview
        - updated_at
        - assignee
        - labels
        - contact
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        astra_conversation_id: { type: string, nullable: true }
        employee_id: { type: string, nullable: true }
        status: { type: string, enum: [open, pending, closed] }
        handoff: { type: string, enum: [ai, human] }
        unread_count: { type: integer }
        last_message_preview: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }
        assignee:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
        labels:
          type: array
          items: { type: string }
        contact:
          type: object
          required: [phone, name, opted_out]
          properties:
            phone: { type: string, nullable: true }
            name: { type: string, nullable: true }
            opted_out: { type: boolean }
    Message:
      type: object
      required:
        - id
        - tenant_id
        - direction
        - type
        - text
        - media
        - template_name
        - status
        - failure_reason
        - sender
        - created_at
        - whatsapp_message_id
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        direction: { type: string, enum: [inbound, outbound] }
        type: { type: string }
        text: { type: string, nullable: true }
        media:
          type: object
          nullable: true
          properties:
            url: { type: string }
            mime_type: { type: string, nullable: true }
        template_name: { type: string, nullable: true }
        status: { type: string }
        failure_reason: { type: string, nullable: true }
        sender:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [contact, human, ai] }
            member_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        whatsapp_message_id: { type: string, nullable: true }
    HandoffResult:
      type: object
      required: [conversation_id, handoff, changed]
      properties:
        conversation_id: { type: string, format: uuid }
        handoff: { type: string, enum: [ai, human] }
        changed: { type: boolean }
